<!DOCTYPE html>
<html lang="en">

<head>

<title>ALAMIN CHAT AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="sidebar">

    <div class="logo">
        🤖 ALAMIN CHAT AI
    </div>


    <button class="new-chat">
        + New Chat
    </button>


    <div class="history">
        Chat History
    </div>


</div>



<div class="main">


    <div class="topbar">
        ALAMIN CHAT AI
    </div>



    <div id="chat">


        <div class="ai message">
            👋 Assalam-o-Alaikum! Main ALAMIN CHAT AI hoon.
        </div>


    </div>



    <!-- Typing Animation -->

<div id="typing" class="typing">
    <span></span>
    <span></span>
    <span></span>
</div>


    <div class="input-area">


        <input 
        id="message"
        placeholder="Message ALAMIN CHAT  AI..."
        >


        <button onclick="sendMessage()">
            Send
        </button>


    </div>



</div>



<script src="script.js"></script>


</body>

</html>
